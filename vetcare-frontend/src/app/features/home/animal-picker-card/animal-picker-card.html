<a class="animal-card" [href]="href">
  <span class="photo">
    <img
      [src]="image"
      [srcset]="image2x + ' 2x'"
      [alt]="name"
      width="320"
      height="240"
      draggable="false"
      [attr.loading]="priority ? 'eager' : 'lazy'"
      [attr.fetchpriority]="priority ? 'high' : null"
    >
  </span>
  <span class="name">{{ name }}</span>
  <span class="cta">Pogledaj ponudu →</span>
</a>
