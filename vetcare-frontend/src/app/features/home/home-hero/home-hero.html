<section class="hero">
  <div class="wrap hero-pop-in">
    <div class="hero-head">
      <h1>Odaberite životinju</h1>
      <p>Brže do proizvoda koji vam treba.</p>
    </div>

    @if (isDesktop()) {
      <app-animal-picker-grid />
    } @else {
      <app-animal-carousel [entranceDone]="entranceDone()" />
    }

    <div class="hero-quick-search">
      <app-quick-search-row />
    </div>
  </div>
</section>
