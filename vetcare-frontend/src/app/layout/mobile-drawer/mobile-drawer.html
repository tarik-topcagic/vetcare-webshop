<div class="mobile-drawer" id="mobile-drawer" [class.open]="open" [attr.aria-hidden]="!open">
  <div class="scrim" (click)="closed.emit()"></div>
  <div class="panel" role="dialog" aria-modal="true" aria-label="Meni kategorija">
    <button class="close-btn" type="button" aria-label="Zatvori meni" (click)="closed.emit()">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M18 6L6 18M6 6l12 12"/>
      </svg>
    </button>
    <nav aria-label="Kategorije proizvoda">
      @for (cat of categories; track cat.slug) {
        <a [href]="categoryHref(cat.slug)" (click)="closed.emit()">{{ cat.label }}</a>
      }
    </nav>
  </div>
</div>
